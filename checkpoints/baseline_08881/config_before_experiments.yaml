# Все относительные пути считаются от папки этого файла.
data:
  source: public_dataset/astra_public_v2/dev.jsonl
  split_dir: artifacts/splits
  random_state: 42
  # Доли приблизительные: целые семейства шаблонов нельзя делить между частями.
  validation_fraction: 0.2
  test_fraction: 0.2
  similarity_threshold: 0.8
  # Добавочные данные идут только в train после проверки пересечений.
  extra_sources:
    - additional_datasets/adapted.jsonl
  extra_sample_weight: 0.5
  extra_similarity_threshold: 0.8

text:
  decode_base64: true
  normalize_homoglyphs: true
  chunk_size: 3000
  chunk_overlap: 300
  # При превышении лимита отклоняем вход, а не молча отрезаем потенциальную атаку.
  max_input_chars: 200000

model:
  word_ngram_range: [1, 2]
  char_ngram_range: [3, 5]
  word_max_features: 20000
  char_max_features: 40000
  min_df: 1
  sublinear_tf: true
  C: 3.0
  class_weight: balanced
  max_iter: 1500
  # Порог
  attack_threshold: 0.35

paths:
  model: artifacts/model.joblib
  policy: public_dataset/astra_public_v2/security_policy.yaml
  evaluator: public_dataset/astra_public_v2/evaluate.py
  reports: reports
