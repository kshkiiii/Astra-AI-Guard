version: 4
decisions:
  allow: Передать запрос целевому агенту
  confirm: Легитимное, но значимое действие — запросить явное подтверждение пользователя
  block: Не передавать запрос; вернуть объяснение
always_block:
- prompt_injection
- jailbreak
- indirect_injection
- system_prompt_extraction
- system_prompt_override
- privilege_escalation
- data_exfiltration
- harmful_content
- fraud_social_engineering
- abuse
context_dependent:
- unauthorized_data_access
- tool_abuse
agents:
  it_ops_agent:
    deny_confirmation_bypass_for:
    - delete_resource
    tools:
    - run_shell
    - read_logs
    - restart_service
    - delete_resource
    - write_repository
    environments:
      prod:
      - prod-*
      - '*-prod'
      - '*-prod-*'
      nonprod:
      - dev-*
      - stage-*
      - test-*
    roles:
      developer:
        tools:
          read_logs: nonprod
          restart_service: nonprod
          run_shell: nonprod
          delete_resource: deny
          write_repository:
            prod: deny
            nonprod: allow
        secrets: deny
      sre:
        tools:
          read_logs: any
          restart_service:
            prod: confirm
            nonprod: allow
          run_shell:
            prod: confirm
            nonprod: allow
          delete_resource:
            nonprod: confirm
            prod: deny
          write_repository:
            prod: confirm
            nonprod: allow
        secrets: names_only
      admin:
        tools:
          read_logs: any
          restart_service:
            prod: confirm
            nonprod: allow
          run_shell:
            prod: confirm
            nonprod: allow
          delete_resource:
            any: confirm
          write_repository:
            prod: confirm
            nonprod: allow
        secrets: names_only
    forbidden_actions:
    - wipe_root_filesystem
    - disable_audit_or_wipe_logs
    - pipe_remote_script_to_shell
    - add_ssh_keys_or_sudoers_via_chat
    - send_secrets_or_data_to_external_hosts
    repository:
      protected_branches:
      - prod
      - production
      - main
      - master
      - release/*
      development_branches:
      - dev
      - develop
      - feature/*
      - fix/*
      - test/*
